# Publishes the packages whose release tags point at the checked-out
# commit, each from its own folder, through `rafa release publish`.
#
# A release is settled first, locally or in CI, with `rafa release
# settle`: it folds the change fragments in `.changes/` into one version
# per package that moved, writes each package's CHANGELOG.md, and tags
# `<name>@<version>`. Pushing those tags runs this workflow.
#
# Each package publishes through `scripts/publish-package.ts`, which
# packs it with every `workspace:` range filled in from the siblings'
# manifests, refuses a tarball the pack check rejects, and runs
# `npm publish` on it.
#
# npm trusted publishing: npm 11.5.1 or newer, `id-token: write` on the
# job, and a trusted publisher configured on npmjs.com for each package,
# naming this repository and this workflow file. npm attaches provenance
# on a trusted publish, so no token and no flag are set here.
#
# The job runs only while the repository variable RAFA_RELEASE_PUBLISH
# reads `ci`: gh variable set RAFA_RELEASE_PUBLISH --body ci
name: Release publish

on:
  push:
    tags: ['@open-tomato/*@*']
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to publish from.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: vars.RAFA_RELEASE_PUBLISH == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Gates
        run: bun run gates

      # The checkout holds no rafa config: `.rafa/` is local to each clone.
      - name: Write the CI config
        shell: bash
        run: |
          mkdir -p .rafa
          printf '%s\n' \
            '# Written by the Release publish workflow.' \
            'release:' \
            '  enabled: true' \
            '  publish: ci' \
            '  publishCommand: bun ../../scripts/publish-package.ts' \
            > .rafa/config.yaml

      - name: Publish
        shell: bash
        run: |
          bun install -g @open-tomato/rafa@0.52.0
          export PATH="${BUN_INSTALL:-$HOME/.bun}/bin:$PATH"
          rafa release publish
